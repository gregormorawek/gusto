<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget=resizes-content: ohne diese Direktive laesst
         Mobile Safari beim Einblenden der Tastatur nur den VISUELLEN
         Viewport schrumpfen, der Layout-Viewport (und damit dvh-Einheiten
         wie in OnboardingWizard.jsx/EinstellungenPanel.jsx) bleibt
         unveraendert - Safari scrollt dann selbststaendig, um das fokussierte
         Feld sichtbar zu halten, und schiesst dabei sichtbar ueber das Ziel
         hinaus (Header verschwindet hinter der Statusleiste). Mit dieser
         Direktive resized sich der Layout-Viewport tatsaechlich, dvh
         reflowt korrekt, kein aggressives Auto-Scroll noetig. Unterstuetzt
         ab Safari 16.4/Chrome 108, unbekannte Werte werden von aelteren
         Browsern ignoriert (kein Risiko fuer Abwaertskompatibilitaet).

         NICHT auf overlays-content/resizes-visual umstellen, auch wenn der
         dvh-Reflow beim Tastatur-Einblenden fuer sich genommen ruckartig
         wirken kann (siehe Bugfix "Ruckartige Tastatur-Verschiebung") - das
         war genau die oben beschriebene, am Geraet verifizierte Regression.
         Stattdessen wird die verbleibende Ruckartigkeit seitdem ueber drei
         ADDITIVE Massnahmen abgefedert, ohne dieses Setting anzufassen:
         scroll-behavior:smooth in index.css, ein sticky-Header im Wizard
         (OnboardingWizard.jsx, kann strukturell nicht hinter die
         Statusleiste scrollen) und ein Visual-Viewport-Backstop
         (useTastaturAusgleich.js), der nur bei tatsaechlich verbleibender
         Ueberdeckung sanft nachkorrigiert. -->
    <!-- viewport-fit=cover: noetig, damit env(safe-area-inset-bottom) (siehe
         TabLeiste.jsx/.tab-leiste) auf iPhones mit Home-Indicator ueberhaupt
         einen von 0 verschiedenen Wert liefert - ohne dieses Flag bleiben
         Safe-Area-Insets laut Spezifikation immer 0. -->
    <!-- maximum-scale=1, user-scalable=no: GEFUNDENE URSACHE eines
         Real-Device-Bugreports ("Rezeptkarte ragt rechts raus, Einkaufswagen-
         Button halb abgeschnitten, beim Scrollen nach links liegt die Karte
         flush am Rand ohne Radius"). Per Playwright/WebKit ueber 24
         verschiedene Rezepte, alle 3 Zielbreiten, Dev- UND Produktions-Build
         gruendlich nachgemessen: getBoundingClientRect() auf JEDEM
         DOM-Element sowie document.documentElement.scrollWidth/
         scrollHeight vs. clientWidth/clientHeight sind IMMER exakt gleich -
         es gibt nachweislich KEINEN CSS-/Layout-Overflow. Das beschriebene
         Symptom (halb abgeschnitten im Ruhezustand, "flush ohne Radius" beim
         Scrollen) passt stattdessen exakt zu einem gezoomten + verschobenen
         WKWebView-Viewport (natives Pinch-Zoom war bis hierher NICHT
         deaktiviert, da diese Meta-Direktive minimum-scale/maximum-scale
         bisher fehlte) - ein Zoom-Zustand aendert nur den visuellen
         Viewport (window.visualViewport), NICHT scrollWidth/
         getBoundingClientRect(), weshalb er in den CSS-Messungen unsichtbar
         bleibt, fuer das Auge aber ununterscheidbar von einem "die Karte ist
         zu breit"-Bug aussieht. user-scalable=no unterbindet Pinch-Zoom in
         der WKWebView komplett (Standard-Vorgehen fuer App-artige
         Capacitor-Web-Views) und schliesst diese Fehlerklasse dauerhaft aus,
         unabhaengig davon, wie genau der Zoom-Zustand zustande kam. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <title>gusto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
